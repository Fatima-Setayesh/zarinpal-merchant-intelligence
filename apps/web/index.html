<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A traceable merchant decision intelligence experience for the Zarinpal Challenge."
    />
    <meta name="theme-color" content="#f4f5f7" />
    <link
      rel="preload"
      href="/fonts/Vazirmatn-Variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>Zarinpal Merchant Intelligence</title>
    <script>
      (() => {
        let savedTheme = null;
        try {
          savedTheme = localStorage.getItem("merchant-intelligence-theme");
        } catch {
          savedTheme = null;
        }
        const requestedTheme = new URLSearchParams(location.search).get(
          "theme",
        );
        const theme =
          requestedTheme === "dark" || requestedTheme === "light"
            ? requestedTheme
            : savedTheme === "dark" || savedTheme === "light"
              ? savedTheme
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
        document.documentElement.dataset.theme = theme;
        document.documentElement.classList.toggle("dark", theme === "dark");
        document.querySelector('meta[name="theme-color"]').content =
          theme === "dark" ? "#0d0f14" : "#f4f5f7";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
