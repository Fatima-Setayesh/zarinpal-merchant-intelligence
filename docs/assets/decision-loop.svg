    <g transform="translate(420 250)"><circle r="72" fill="#24194f" stroke="#9a6df0" stroke-width="3"/><text y="-7" fill="#cbb9ff" font-size="18" font-weight="700">02</text><text y="25" fill="white" font-size="22" font-weight="700">Evidence</text></g>
    <g transform="translate(675 250)"><circle r="72" fill="#2a1c50" stroke="#b487df" stroke-width="3"/><text y="-7" fill="#dec8ff" font-size="18" font-weight="700">03</text><text y="25" fill="white" font-size="22" font-weight="700">Insight</text></g>
    <g transform="translate(930 250)"><circle r="72" fill="#332249" stroke="#cf9bc1" stroke-width="3"/><text y="-7" fill="#efcee8" font-size="18" font-weight="700">04</text><text y="21" fill="white" font-size="21" font-weight="700">Business</text><text y="47" fill="white" font-size="21" font-weight="700">Impact</text></g>
    <g transform="translate(1185 250)"><circle r="72" fill="#3a2940" stroke="#e7ab88" stroke-width="3"/><text y="-7" fill="#ffd9bd" font-size="18" font-weight="700">05</text><text y="21" fill="white" font-size="21" font-weight="700">Recommended</text><text y="47" fill="white" font-size="21" font-weight="700">Action</text></g>
