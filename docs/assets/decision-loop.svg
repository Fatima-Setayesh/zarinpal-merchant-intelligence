<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" role="img" aria-labelledby="title desc">
  <title id="title">Evidence to action product loop</title>
  <desc id="desc">Raw data becomes evidence, insight, business impact, recommended action, and traceability.</desc>
  <defs>
