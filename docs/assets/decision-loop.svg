    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#8b5cf6"/><stop offset="1" stop-color="#f5bd4f"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity=".24"/></filter>
  </defs>
  <rect width="1600" height="500" rx="36" fill="url(#bg)"/>
  <path d="M165 250H1435" stroke="url(#line)" stroke-width="6" stroke-linecap="round" opacity=".7"/>
